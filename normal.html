<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>암시장 made by 모르핀</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f0f2f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #222; margin-bottom: 5px; }
        .desc { text-align: center; color: #666; font-size: 13px; margin-bottom: 25px; }

        .item-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .item-table th { background: #f8f9fa; color: #555; font-size: 14px; padding: 10px; border-bottom: 2px solid #dee2e6; }
        .item-table td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }

        .item-name { font-weight: bold; color: #333; font-size: 14px; text-align: left; }
        .input-box { width: 90px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; text-align: right; font-size: 14px; }
        .input-box:focus { outline: none; border-color: #e67e22; box-shadow: 0 0 5px rgba(230,126,34,0.2); }

        .price-col { background: #fffdfa; }

        .total-section { background: #343a40; color: white; padding: 20px; border-radius: 10px; text-align: center; margin-top: 20px; }
        .total-label { font-size: 16px; margin-bottom: 5px; display: block; }
        .total-amount { font-size: 28px; font-weight: bold; color: #ffc107; }
    </style>
</head>
<body>

<div class="container">
    <h2>바농 계산기</h2>


    <table class="item-table">
        <thead>
        <tr>
            <th>품목명</th>
            <th>단가(냥)</th>
            <th>수량(셜커)</th>
        </tr>
        </thead>
        <tbody id="item-body">
        </tbody>
    </table>

    <div class="total-section">
        <span class="total-label">총액</span>
        <span class="total-amount" id="grand-total">0</span>냥
    </div>
</div>

<script>
    // 품목명과 기본 단가 설정
    const itemData = [
        { name: '감자', price: 7000 },
        { name: '당근', price: 7000 },
        { name: '호박', price: 6000 },
        { name: '달콤한열매', price: 18000 },
        { name: '비트', price: 15000 },
        { name: '건초더미', price: 33000 },
        { name: '생고기', price: 50000 }
    ];

    const tbody = document.getElementById('item-body');

    // 표 생성 및 기본값 배치
    itemData.forEach((item) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="item-name">${item.name}</td>
            <td class="price-col">
                <input type="number" class="price-input input-box" oninput="calc()" value="${item.price}" min="0">
            </td>
            <td>
                <input type="number" class="count-input input-box" oninput="calc()" value="0" min="0">
            </td>
        `;
        tbody.appendChild(tr);
    });

    function calc() {
        let total = 0;
        const rows = tbody.querySelectorAll('tr');

        rows.forEach(row => {
            const price = parseInt(row.querySelector('.price-input').value) || 0;
            const count = parseInt(row.querySelector('.count-input').value) || 0;
            total += price * count;
        });

        document.getElementById('grand-total').innerText = total.toLocaleString();
    }

    // 페이지 로드 시 초기 계산 실행
    calc();
</script>

</body>
</html>
