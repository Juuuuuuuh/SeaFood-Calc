<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070a;
    --panel:#0a1119;
    --panel-border:rgba(56,242,255,0.22);
    --panel-hole:#03060a;
    --text:#d7ecf5;
    --text-dim:#4f7186;
    --track:#101a24;
    --alert:#ff2e9a;
    --accent:#38f2ff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Chakra Petch',sans-serif;
    background:
      linear-gradient(rgba(56,242,255,0.05) 1px, transparent 1px) 0 0/42px 42px,
      linear-gradient(90deg, rgba(56,242,255,0.05) 1px, transparent 1px) 0 0/42px 42px,
      radial-gradient(ellipse at 50% -10%, rgba(56,242,255,0.09), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
    padding:36px 20px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
  }
  .scanline{
    position:fixed; inset:0; pointer-events:none; z-index:999;
    background:linear-gradient(transparent 0%, rgba(56,242,255,0.05) 50%, transparent 100%);
    background-size:100% 240px;
    animation:scan 8s linear infinite;
    mix-blend-mode:screen;
  }
  @keyframes scan{ from{background-position-y:-240px;} to{background-position-y:100vh;} }

  header{ width:100%; max-width:1240px; margin-bottom:22px; }
  h1{
    font-size:1.9rem;
    font-weight:700;
    letter-spacing:0.01em;
    margin:0 0 10px;
    color:var(--accent);
    text-shadow:0 0 14px rgba(56,242,255,0.45);
  }
  .cursor{ display:inline-block; animation:blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .sub{ color:var(--text-dim); font-size:0.9rem; line-height:1.6; margin:0; max-width:62ch; }

  .toolbar{
    width:100%;
    max-width:1240px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    padding:16px 20px;
    margin:24px 0 28px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .toolbar-label{
    font-size:0.85rem;
    color:var(--text-dim);
    white-space:nowrap;
  }
  input[type="file"]{ color:var(--text-dim); font-size:0.8rem; max-width:210px; font-family:'Chakra Petch',sans-serif; }
  input[type="file"]::file-selector-button{
    background:var(--track);
    color:var(--accent);
    border:1px solid var(--panel-border);
    padding:6px 10px;
    font-family:'Chakra Petch',sans-serif;
    font-size:0.76rem;
    cursor:pointer;
    margin-right:8px;
  }
  .btn{
    padding:7px 13px;
    border:1px solid var(--panel-border);
    cursor:pointer;
    color:var(--accent);
    font-weight:500;
    font-size:0.8rem;
    font-family:'Chakra Petch',sans-serif;
    background:transparent;
    transition:border-color .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .btn:hover{ border-color:var(--accent); box-shadow:0 0 10px rgba(56,242,255,0.25); }
  .btn:active{ transform:scale(0.97); }
  .sound-name{ font-family:'JetBrains Mono',monospace; font-size:0.76rem; color:var(--accent); }
  .hint{ color:var(--text-dim); font-size:0.76rem; width:100%; line-height:1.4; opacity:0.8; }

  .lamps{ margin-left:auto; display:flex; align-items:center; gap:16px; }
  .lamp{ display:flex; align-items:center; gap:7px; font-size:0.82rem; color:var(--text-dim); white-space:nowrap; }
  .lamp i{ width:8px; height:8px; border-radius:50%; background:#2a3944; flex:none; }
  .lamp b{ color:var(--text); font-weight:600; }
  .lamp.active i{ background:var(--accent); box-shadow:0 0 7px var(--accent); }
  .lamp.alert i{ background:var(--alert); box-shadow:0 0 7px var(--alert); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:18px;
    width:100%;
    max-width:1240px;
  }

  /* 채널 색 6종 순환 - 마젠타(--alert)는 알람 전용으로 예약 */
  .card:nth-child(6n+1){ --accent:#38f2ff; }
  .card:nth-child(6n+2){ --accent:#ffb020; }
  .card:nth-child(6n+3){ --accent:#39ff88; }
  .card:nth-child(6n+4){ --accent:#b366ff; }
  .card:nth-child(6n+5){ --accent:#ff6b35; }
  .card:nth-child(6n+6){ --accent:#2ee6b8; }

  .card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    clip-path:polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
    padding:20px 16px 22px;
    text-align:center;
    position:relative;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .card::before, .card::after{
    content:''; position:absolute; width:13px; height:13px;
    border-color:var(--accent); border-style:solid; opacity:0.85; pointer-events:none;
  }
  .card::before{ top:7px; left:7px; border-width:2px 0 0 2px; }
  .card::after{ bottom:7px; right:7px; border-width:0 2px 2px 0; }

  .card.running{
    border-color:var(--accent);
    box-shadow:0 0 0 1px rgba(56,242,255,0.06), 0 10px 30px -16px var(--accent);
  }
  .card.finished{ border-color:var(--alert); animation:pulse 1s infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 1px rgba(255,46,154,0.18), 0 0 0 rgba(255,46,154,0); }
    50%{ box-shadow:0 0 0 1px rgba(255,46,154,0.4), 0 0 26px rgba(255,46,154,0.4); }
  }

  .status-dot{
    position:absolute; top:16px; right:18px;
    width:7px; height:7px; border-radius:50%;
    background:#2a3944;
  }
  .card.running .status-dot{ background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .card.finished .status-dot{ background:var(--alert); box-shadow:0 0 8px var(--alert); }

  .name-input{
    background:transparent;
    border:none;
    border-bottom:1px solid transparent;
    text-align:center;
    font-weight:600;
    font-size:0.9rem;
    color:var(--text);
    width:88%;
    margin-bottom:14px;
    outline:none;
    padding:2px 0 4px;
    font-family:'Chakra Petch',sans-serif;
    letter-spacing:0.02em;
  }
  .name-input:not(:read-only):hover,
  .name-input:not(:read-only):focus{ border-bottom-color:var(--accent); }
  .name-input:read-only{ cursor:default; }

  .ring-wrap{ position:relative; width:132px; height:132px; margin:0 auto 14px; }
  .ring-ticks{
    position:absolute; inset:-7px; border-radius:50%;
    background:repeating-conic-gradient(var(--accent) 0deg 1.2deg, transparent 1.2deg 12deg);
    opacity:0.25;
    -webkit-mask:radial-gradient(circle, transparent 60%, black 61%, black 67%, transparent 68%);
    mask:radial-gradient(circle, transparent 60%, black 61%, black 67%, transparent 68%);
  }
  .ring{
    position:relative;
    width:100%; height:100%; border-radius:50%;
    background: conic-gradient(var(--track) 0 100%);
    display:flex; align-items:center; justify-content:center;
    transition: background 0.4s linear;
  }
  .ring-inner{
    width:76%; height:76%; border-radius:50%;
    background:var(--panel-hole);
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--panel-border);
  }
  .card.running .ring-inner{ box-shadow:0 0 16px -2px var(--accent) inset; }
  .card.finished .ring-inner{ box-shadow:0 0 16px -2px var(--alert) inset; }
  .time{
    font-family:'JetBrains Mono',monospace;
    font-size:1.24rem;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .card.running .time{ color:var(--accent); text-shadow:0 0 10px rgba(56,242,255,0.4); }
  .card.finished .time{ color:var(--alert); text-shadow:0 0 10px rgba(255,46,154,0.5); }

  .inputs{ display:flex; gap:6px; justify-content:center; margin-bottom:14px; }
  .inputs input{
    width:48px;
    padding:7px 4px;
    text-align:center;
    background:var(--panel-hole);
    border:1px solid var(--panel-border);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:0.85rem;
  }
  .inputs input:focus{ outline:none; border-color:var(--accent); }
  .inputs input::placeholder{ color:var(--text-dim); }

  .btns{ display:flex; gap:6px; justify-content:center; }
  .btns button{
    flex:1;
    padding:8px 0;
    cursor:pointer;
    font-weight:600;
    font-size:0.8rem;
    font-family:'Chakra Petch',sans-serif;
    clip-path:polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    transition:filter .12s ease, transform .1s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .btns button:active{ transform:scale(0.96); }
  .start{ background:var(--accent); color:#03080a; border:1px solid var(--accent); }
  .start:hover{ box-shadow:0 0 14px var(--accent); }
  .stop{ background:transparent; color:var(--text); border:1px solid var(--panel-border); }
  .stop:hover{ border-color:var(--text-dim); }
  .reset{ background:transparent; color:var(--text-dim); border:1px solid var(--panel-border); }
  .reset:hover{ border-color:var(--alert); color:var(--alert); }
</style>
</head>
<body>

<div class="scanline"></div>

<header>
  <h1>&gt; CONTROL_TIMER<span class="cursor">_</span></h1>
  <p class="sub">최대 15개 채널을 동시에 가동할 수 있습니다. 알림 권한을 허용하면 창을 닫았다 열어도 상태가 유지되고, 종료 시각에 데스크톱 알림이 전송됩니다.</p>
</header>

<div class="toolbar">
  <span class="toolbar-label">🔔 알림음</span>
  <input type="file" id="soundFile" accept="audio/*">
  <button class="btn" onclick="resetSound()">기본음으로</button>
  <span class="sound-name" id="soundName"></span>
  <span class="lamps" id="sysStatus">
    <span class="lamp active"><i></i>가동 <b id="lampActive">0</b></span>
    <span class="lamp alert"><i></i>알람 <b id="lampAlert">0</b></span>
    <span class="lamp"><i></i>대기 <b id="lampIdle">15</b></span>
  </span>
  <span class="hint">브라우저 저장공간(localStorage) 제약상 너무 큰 파일(수 MB 이상)은 저장되지 않을 수 있어요.</span>
</div>

<div class="grid" id="grid"></div>

<audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto" loop></audio>

<script>
  const grid = document.getElementById('grid');
  const alarmSound = document.getElementById('alarmSound');
  const timers = [];
  const activeBlinks = {};
  const NUM_TIMERS = 15;
  const STATE_KEY = 'timerAppState';
  const SOUND_KEY = 'timerAppSound';
  const SOUND_NAME_KEY = 'timerAppSoundName';
  const DEFAULT_SOUND = "https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3";

  if (Notification.permission !== 'granted' && Notification.permission !== 'denied') {
    Notification.requestPermission();
  }

  function updateSystemStatus() {
    const running = document.querySelectorAll('.card.running').length;
    const finished = document.querySelectorAll('.card.finished').length;
    const idle = NUM_TIMERS - running - finished;
    const a = document.getElementById('lampActive');
    const f = document.getElementById('lampAlert');
    const d = document.getElementById('lampIdle');
    if (a) a.textContent = running;
    if (f) f.textContent = finished;
    if (d) d.textContent = idle;
  }

  // ---------- 커스텀 알림음 ----------
  function loadSavedSound() {
    const saved = localStorage.getItem(SOUND_KEY);
    const savedName = localStorage.getItem(SOUND_NAME_KEY);
    if (saved) {
      alarmSound.src = saved;
      document.getElementById('soundName').innerText = savedName ? `현재: ${savedName}` : '현재: 커스텀 파일';
    } else {
      document.getElementById('soundName').innerText = '현재: 기본음';
    }
  }

  document.getElementById('soundFile').addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (evt) {
      const dataUrl = evt.target.result;
      try {
        localStorage.setItem(SOUND_KEY, dataUrl);
        localStorage.setItem(SOUND_NAME_KEY, file.name);
        alarmSound.src = dataUrl;
        document.getElementById('soundName').innerText = `현재: ${file.name}`;
      } catch (err) {
        alert('파일이 너무 커서 저장할 수 없어요. 더 작은 파일을 선택해주세요.');
      }
    };
    reader.readAsDataURL(file);
  });

  function resetSound() {
    localStorage.removeItem(SOUND_KEY);
    localStorage.removeItem(SOUND_NAME_KEY);
    alarmSound.src = DEFAULT_SOUND;
    document.getElementById('soundName').innerText = '현재: 기본음';
  }

  // ---------- 링(도넛) 진행률 업데이트 ----------
  function updateRing(i, fraction) {
    const ring = document.getElementById(`ring-${i}`);
    if (!ring) return;
    const pct = Math.max(0, Math.min(1, fraction)) * 100;
    const card = document.getElementById(`c-${i}`);
    let color = 'var(--track)';
    if (card.classList.contains('finished')) color = 'var(--alert)';
    else if (card.classList.contains('running')) color = 'var(--accent)';
    ring.style.background = `conic-gradient(${color} ${pct}%, var(--track) 0)`;
  }

  // ---------- 상태 저장 / 복원 ----------
  function saveState() {
    const state = timers.map((t, i) => {
      const nameEl = document.getElementById(`n-${i}`);
      const cardEl = document.getElementById(`c-${i}`);
      const hEl = document.getElementById(`h-${i}`);
      const mEl = document.getElementById(`m-${i}`);
      const sEl = document.getElementById(`s-${i}`);
      return {
        name: nameEl ? nameEl.value : `타이머 ${i + 1}`,
        time: t.time,
        total: t.total || 0,
        running: t.running,
        endTime: t.endTime || null,
        finished: cardEl ? cardEl.classList.contains('finished') : false,
        h: hEl ? hEl.value : '',
        m: mEl ? mEl.value : '',
        s: sEl ? sEl.value : ''
      };
    });
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function createTimer(i, saved) {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `c-${i}`;
    const displayName = saved && saved.name ? saved.name : `타이머 ${i + 1}`;
    card.innerHTML = `
      <div class="status-dot"></div>
      <div><input type="text" class="name-input" id="n-${i}" value="${displayName.replace(/"/g, '&quot;')}"></div>
      <div class="ring-wrap">
        <div class="ring-ticks"></div>
        <div class="ring" id="ring-${i}">
          <div class="ring-inner">
            <div class="time" id="d-${i}">00:00:00</div>
          </div>
        </div>
      </div>
      <div class="inputs" id="in-${i}">
        <input type="number" id="h-${i}" placeholder="시" min="0" value="${saved && saved.h ? saved.h : ''}">
        <input type="number" id="m-${i}" placeholder="분" min="0" value="${saved && saved.m ? saved.m : ''}">
        <input type="number" id="s-${i}" placeholder="초" min="0" value="${saved && saved.s ? saved.s : ''}">
      </div>
      <div class="btns">
        <button class="start" onclick="start(${i})">시작</button>
        <button class="stop" onclick="stop(${i})">정지</button>
        <button class="reset" onclick="reset(${i})">초기화</button>
      </div>
    `;
    grid.appendChild(card);
    timers.push({ time: 0, id: null, running: false, endTime: null, total: 0 });

    // h/m/s 입력값이 바뀔 때마다 저장 (시작 전 값도 유지)
    ['h', 'm', 's'].forEach(p => {
      document.getElementById(`${p}-${i}`).addEventListener('input', saveState);
    });

    if (!saved) return;

    if (saved.running && saved.endTime) {
      const remaining = Math.round((saved.endTime - Date.now()) / 1000);
      timers[i].total = saved.total || remaining;
      if (remaining > 0) {
        timers[i].time = remaining;
        timers[i].endTime = saved.endTime;
        timers[i].running = true;
        document.getElementById(`in-${i}`).style.visibility = 'hidden';
        document.getElementById(`n-${i}`).readOnly = true;
        document.getElementById(`d-${i}`).innerText = new Date(remaining * 1000).toISOString().substr(11, 8);
        card.classList.add('running');
        updateRing(i, remaining / (timers[i].total || remaining));
        runInterval(i, displayName);
      } else {
        timers[i].time = 0;
        document.getElementById(`in-${i}`).style.visibility = 'hidden';
        document.getElementById(`n-${i}`).readOnly = true;
        finish(i, displayName);
      }
    } else if (saved.finished) {
      timers[i].time = 0;
      timers[i].total = saved.total || 0;
      document.getElementById(`in-${i}`).style.visibility = 'hidden';
      document.getElementById(`n-${i}`).readOnly = true;
      document.getElementById(`d-${i}`).innerText = "00:00:00";
      card.classList.add('finished');
      updateRing(i, 0);
      if (activeBlinks[i]) clearInterval(activeBlinks[i]);
      activeBlinks[i] = setInterval(() => {
        document.title = document.title === "종료!!!" ? `${displayName} 종료!` : "종료!!!";
      }, 500);
    } else if (saved.time > 0) {
      timers[i].time = saved.time;
      timers[i].total = saved.total || saved.time;
      document.getElementById(`in-${i}`).style.visibility = 'hidden';
      document.getElementById(`n-${i}`).readOnly = true;
      document.getElementById(`d-${i}`).innerText = new Date(saved.time * 1000).toISOString().substr(11, 8);
      updateRing(i, saved.time / (timers[i].total || saved.time));
    }
    // saved.time === 0 이고 running/finished 아니면: 아직 시작 전 상태. h/m/s 입력값만 복원된 채로 둠 (위 innerHTML에서 처리됨)
  }

  function runInterval(i, name) {
    timers[i].id = setInterval(() => {
      const remaining = Math.round((timers[i].endTime - Date.now()) / 1000);
      timers[i].time = Math.max(0, remaining);
      const timeStr = new Date(Math.max(0, remaining) * 1000).toISOString().substr(11, 8);
      document.getElementById(`d-${i}`).innerText = timeStr;
      updateRing(i, Math.max(0, remaining) / (timers[i].total || 1));

      if (remaining <= 0) {
        clearInterval(timers[i].id);
        finish(i, name);
      } else {
        saveState();
      }
    }, 1000);
  }

  function start(i) {
    if (timers[i].running) return;
    const h = +document.getElementById(`h-${i}`).value || 0;
    const m = +document.getElementById(`m-${i}`).value || 0;
    const s = +document.getElementById(`s-${i}`).value || 0;
    const name = document.getElementById(`n-${i}`).value;

    if (timers[i].time === 0) timers[i].time = h * 3600 + m * 60 + s;
    if (timers[i].time <= 0) return alert("시간을 설정해주세요.");

    timers[i].total = timers[i].time;
    timers[i].running = true;
    timers[i].endTime = Date.now() + timers[i].time * 1000;
    document.getElementById(`in-${i}`).style.visibility = 'hidden';
    document.getElementById(`n-${i}`).readOnly = true;
    document.getElementById(`c-${i}`).classList.add('running');

    updateRing(i, 1);
    runInterval(i, name);
    saveState();
    updateSystemStatus();
  }

  function finish(i, name) {
    timers[i].running = false;
    timers[i].endTime = null;
    const card = document.getElementById(`c-${i}`);
    card.classList.remove('running');
    card.classList.add('finished');
    updateRing(i, 0);

    alarmSound.currentTime = 0;
    alarmSound.play().catch(() => {});

    if (Notification.permission === 'granted') {
      new Notification(`${name} 종료!`, { body: "Time Out." });
    }

    if (activeBlinks[i]) clearInterval(activeBlinks[i]);
    activeBlinks[i] = setInterval(() => {
      document.title = document.title === "종료!!!" ? `${name} 종료!` : "종료!!!";
    }, 500);

    saveState();
    updateSystemStatus();
  }

  function clearAlarmEffects(i) {
    if (activeBlinks[i]) {
      clearInterval(activeBlinks[i]);
      delete activeBlinks[i];
    }
    const remainingFinished = document.querySelectorAll('.finished').length;
    if (remainingFinished === 0) {
      alarmSound.pause();
      alarmSound.currentTime = 0;
      document.title = "Timer";
    }
  }

  function stop(i) {
    const card = document.getElementById(`c-${i}`);

    clearInterval(timers[i].id);

    // Stop을 누르면 항상 처음 설정했던 시간으로 되돌림 (바로 재시작 가능하게)
    timers[i].time = timers[i].total || 0;
    document.getElementById(`d-${i}`).innerText = new Date(timers[i].time * 1000).toISOString().substr(11, 8);

    timers[i].running = false;
    timers[i].endTime = null;
    card.classList.remove('running', 'finished');
    updateRing(i, timers[i].total ? 1 : 0);
    clearAlarmEffects(i);
    saveState();
    updateSystemStatus();
  }

  function reset(i) {
    stop(i);
    timers[i].time = 0;
    timers[i].total = 0;
    timers[i].endTime = null;
    document.getElementById(`d-${i}`).innerText = "00:00:00";
    document.getElementById(`in-${i}`).style.visibility = 'visible';
    document.getElementById(`h-${i}`).value = '';
    document.getElementById(`m-${i}`).value = '';
    document.getElementById(`s-${i}`).value = '';
    document.getElementById(`c-${i}`).classList.remove('running', 'finished');
    document.getElementById(`n-${i}`).readOnly = false;
    updateRing(i, 0);
    clearAlarmEffects(i);
    saveState();
    updateSystemStatus();
  }

  grid.addEventListener('change', (e) => {
    if (e.target.classList.contains('name-input')) saveState();
  });

  // ---------- 초기화 ----------
  loadSavedSound();
  const savedState = loadState();
  for (let i = 0; i < NUM_TIMERS; i++) {
    createTimer(i, savedState ? savedState[i] : null);
  }
  saveState();
  updateSystemStatus();
</script>
</body>
</html>
